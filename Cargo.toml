[package]
name = "gpg-keys"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std", "zeroize"] }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
hex = "0.4"
hkdf = "0.12"
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-openssl", "compression"] }
sha2 = "0.10"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
